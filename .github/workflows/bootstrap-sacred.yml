name: Bootstrap Sacred Computations Map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sacred.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard destination
        run: |
          set -euo pipefail
          test ! -e Sacred-Computations-Map

      - name: Reconstruct source archive
        run: |
          set -euo pipefail
          cat .bootstrap-sacred/payload.*.b64 | base64 --decode > /tmp/sacred-computations.tar.xz
          mkdir -p /tmp/sacred-extract
          tar -xJf /tmp/sacred-computations.tar.xz -C /tmp/sacred-extract
          test -f /tmp/sacred-extract/Sacred-Computations/README.md
          mv /tmp/sacred-extract/Sacred-Computations Sacred-Computations-Map

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Sacred-Computations-Map/requirements.txt

      - name: Verify and build
        run: |
          set -euo pipefail
          cd Sacred-Computations-Map
          bash ./run_checks.sh
          test -f dist/index.html
          test -f dist/data/graph.json

      - name: Commit Sacred-Computations-Map
        run: |
          set -euo pipefail
          rm -rf .bootstrap-sacred
          rm -f .github/workflows/bootstrap-sacred.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Sacred-Computations-Map"
          git push origin HEAD:main
