name: bootstrap-chaos-coding-map
on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/fractal-chaos-coding-map.zip"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project into monorepo subdirectory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Chaos-Coding-Map .bootstrap/unpack
          mkdir -p .bootstrap/unpack
          unzip -q .bootstrap/fractal-chaos-coding-map.zip -d .bootstrap/unpack
          mv .bootstrap/unpack/fractal-chaos-coding-map Chaos-Coding-Map
          rm -rf .bootstrap/unpack .bootstrap/fractal-chaos-coding-map.zip .bootstrap/seed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Fractal Chaos Coding Map v0.1.0"
          git push
